line-length = 100
target-version = "py37"
extend-exclude = ["archive_restore/bin/lib"]

[lint]
extend-select = ["I", "B", "S"]
ignore = ["S603"]  # argv-only subprocess is the documented pattern (ops.run)

[lint.per-file-ignores]
"tests/*" = ["S101", "S108"]

[lint.isort]
known-first-party = ["archive_restore", "archive_restore_cli", "_bootstrap", "conftest"]
known-third-party = ["splunklib"]
