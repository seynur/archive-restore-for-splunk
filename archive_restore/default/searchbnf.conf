[archivelist-command]
syntax = archivelist (index=<string>)?
shortdesc = List archived indexes, or archived buckets in the search time range.
description = Without index, returns one row per archived index (buckets, earliest, latest, bytes). \
  With index (comma-separated), returns the archived buckets that overlap the search time range \
  and whether each is already thawed.
usage = public
example1 = | archivelist
comment1 = Summary of every archived index.
example2 = | archivelist index=wineventlog
comment2 = Archived buckets of wineventlog in the search time range.

[archiverestore-command]
syntax = archiverestore index=<string> (dry_run=<bool>)?
shortdesc = Restore archived buckets in the search time range into each index's thaweddb.
description = Copies, integrity-checks, rebuilds and moves each archived bucket into the \
  index's thaweddb. Requires the archive_restore capability. \
  Already-thawed buckets are skipped.
usage = public
example1 = | archiverestore index=wineventlog dry_run=t
comment1 = Show what would be restored.

[archivedelete-command]
syntax = archivedelete index=<string> bucket=<string>
shortdesc = Remove restored buckets from an index's thaweddb.
description = Deletes the named thawed bucket, or with bucket=* every thawed bucket overlapping \
  the search time range (including manually thawed ones). Requires the archive_restore capability. Never touches the archive.
usage = public
example1 = | archivedelete index=wineventlog bucket=db_1700000000_1690000000_12
